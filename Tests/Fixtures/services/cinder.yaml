name: cinder
namespace: openstack
version: "0.0.1"
description: "OpenStack Block Storage Service"
helm_chart:
  repository: https://github.com/openstack/openstack-helm
  name: cinder
  version: "0.1.0"
  namespace: openstack
labels:
  - name: openstack
secrets:
  - name: cinder-password
    type: Opaque
    rotate_with_service: true
    keys:
      - password
  - name: cinder-keystone-user-password
    type: Opaque
    rotate_with_service: true
    keys:
      - password
  - name: cinder-database-password
    type: Opaque
    rotate_with_service: false
    keys:
      - password
dependencies:
  - name: keystone
    secrets:
      - keystone-fernet-key
  - name: nova
    secrets:
      - nova-service-password
