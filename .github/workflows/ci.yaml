name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        swift: [6.3]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Swift
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: ${{ matrix.swift }}
    
    - name: Resolve dependencies
      run: swift package resolve
    
    - name: Build
      run: swift build -v
    
    - name: Run tests
      run: swift test -v
    
    - name: Run linter (if available)
      run: |
        # SwiftLint would go here if added as a dependency
        echo "Linting not configured yet"

  test-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        swift: [6.3]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Swift
      uses: swift-actions/setup-swift@v3
      with:
        swift-version: ${{ matrix.swift }}
    
    - name: Resolve dependencies
      run: swift package resolve
    
    - name: Build
      run: swift build -v
    
    - name: Run tests
      run: swift test -v
