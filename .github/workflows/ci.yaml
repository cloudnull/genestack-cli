name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Swift
        run: |
          # Use pre-installed Swift or install manually to avoid setup-swift issues
          if ! command -v swift &> /dev/null; then
            wget -q https://swift.org/builds/swift-6.3.2-release/ubuntu2404/swift-6.3.2-RELEASE/swift-6.3.2-RELEASE-ubuntu24.04.tar.gz
            tar xzf swift-6.3.2-RELEASE-ubuntu24.04.tar.gz
            echo "$(pwd)/swift-6.3.2-RELEASE-ubuntu24.04/usr/bin" >> $GITHUB_PATH
            ln -sf "$(pwd)/swift-6.3.2-RELEASE-ubuntu24.04/usr/lib64/swift/linux/flatcc/bin/flatcc" /usr/local/bin/flatcc || true
          fi
          swift --version
      
      - name: Resolve dependencies
        run: swift package resolve
      
      - name: Build (syntax check)
        run: swift build

  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Swift
        run: |
          if ! command -v swift &> /dev/null; then
            brew install swift
          fi
          swift --version
      
      - name: Resolve dependencies
        run: swift package resolve
      
      - name: Build
        run: swift build -v
      
      - name: Run tests
        run: swift test -v
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: |
            test-results-macos.xml
            !**/*.git/**

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.3"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Swift
        run: |
          if ! command -v swift &> /dev/null; then
            SWIFT_VERSION="6.3-RELEASE"
            SWIFT_PLATFORM="ubuntu24.04"
            SWIFT_ARCHIVE="swift-${SWIFT_VERSION}-${SWIFT_PLATFORM}.tar.gz"
            
            wget -q "https://swift.org/builds/swift-${SWIFT_VERSION}/${SWIFT_PLATFORM}/swift-${SWIFT_VERSION}/${SWIFT_PLATFORM}/$SWIFT_ARCHIVE"
            tar xzf "$SWIFT_ARCHIVE"
            echo "$(pwd)/swift-${SWIFT_VERSION}/usr/bin" >> $GITHUB_PATH
          fi
          swift --version
      
      - name: Resolve dependencies
        run: swift package resolve
      
      - name: Build
        run: swift build -v
      
      - name: Run tests
        run: swift test -v
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: |
            test-results-linux.xml
            !**/*.git/**

  build-release:
    name: Build Release Binaries
    needs: [lint, test-macos, test-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Swift
        run: |
          if ! command -v swift &> /dev/null; then
            SWIFT_VERSION="6.3-RELEASE"
            SWIFT_PLATFORM="ubuntu24.04"
            SWIFT_ARCHIVE="swift-${SWIFT_VERSION}-${SWIFT_PLATFORM}.tar.gz"
            
            wget -q "https://swift.org/builds/swift-${SWIFT_VERSION}/${SWIFT_PLATFORM}/swift-${SWIFT_VERSION}/${SWIFT_PLATFORM}/$SWIFT_ARCHIVE"
            tar xzf "$SWIFT_ARCHIVE"
            echo "$(pwd)/swift-${SWIFT_VERSION}/usr/bin" >> $GITHUB_PATH
          fi
          
          swift --version
      
      - name: Resolve dependencies
        run: swift package resolve
      
      - name: Build Release
        run: swift build -c release
      
      - name: Verify Binary
        run: .build/release/genectl --version
      
      - name: Test Binary
        run: |
          .build/release/genectl --help
          .build/release/genectl config create --yes --cluster-name test-cluster --output /tmp/genestack-cluster.yaml
          .build/release/genectl config validate --config /tmp/genestack-cluster.yaml
