name: Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "packaging/**"
      - "Package.swift"
      - "Sources/**"
      - "Tests/**"

jobs:
  build-binaries:
    name: Build Binaries
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.2"
      
      - name: Resolve version
        id: version
        run: |
          # Extract version from git tags or commit
          TAG="$(git describe --tags --always 2>/dev/null || echo "0.0.0")"
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Build release binary
        run: swift build -c release
      
      - name: Strip binary
        run: strip .build/release/genectl
      
      - name: Verify binary
        run: .build/release/genectl --version
      
      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: genectl-binary
          path: .build/release/genectl
          retention-days: 14

  build-rpm:
    name: Build RPM
    needs: build-binaries
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.2"
      
      - name: Install RPM tools
        run: sudo apt-get update && sudo apt-get install -y rpm rpm-build
      
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: genectl-binary
          path: .build/release/
      
      - name: Determine version
        id: version
        run: |
          TAG="$(git describe --tags --always 2>/dev/null || echo "0.0.0")"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
      
      - name: Build RPM
        run: |
          mkdir -p packaging/rpm/build/SOURCES
          cp .build/release/genectl packaging/rpm/build/SOURCES/
          chmod 0755 packaging/rpm/build/SOURCES/genectl
          cp packaging/LICENSE packaging/rpm/build/SOURCES/
          
          rpmbuild -bb packaging/rpm/SPECS/genectl.spec \
            --define "pkgver ${{ steps.version.outputs.version }}" \
            --define "_topdir packaging/rpm/build" \
            --define "_sourcedir packaging/rpm/build/SOURCES" \
            --define "dist .el9"
      
      - name: Show RPM packages
        run: find packaging/rpm/build/RPMS -name '*.rpm' -exec ls -lh {} \;
      
      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: genectl-rpm
          path: packaging/rpm/build/RPMS/**/*.rpm
          retention-days: 14

  build-deb:
    name: Build DEB
    needs: build-binaries
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Install Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "6.3.2"
      
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev
      
      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: genectl-binary
          path: .build/release/
      
      - name: Determine version and architecture
        id: version
        run: |
          TAG="$(git describe --tags --always 2>/dev/null || echo "0.0.0")"
          VERSION="${TAG#v}"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64)  DEB_ARCH=amd64 ;;
            aarch64) DEB_ARCH=arm64 ;;
            *) DEB_ARCH=amd64 ;;
          esac
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "arch=${DEB_ARCH}" >> $GITHUB_OUTPUT
      
      - name: Build DEB
        run: |
          WORK="packaging/deb/build"
          mkdir -p "$WORK"
          
          PKG="genectl"
          VERSION="${{ steps.version.outputs.version }}"
          DEB_ARCH="${{ steps.version.outputs.arch }}"
          
          stage="$WORK/${PKG}_${VERSION}_${DEB_ARCH}"
          rm -rf "$stage"
          mkdir -p "$stage/DEBIAN" "$stage/usr/bin"
          
          cp .build/release/genectl "$stage/usr/bin/genectl"
          chmod 0755 "$stage/usr/bin/genectl"
          
          sed -e "s/@VERSION@/${VERSION}/" -e "s/@ARCH@/${DEB_ARCH}/" \
              packaging/deb/packages/genectl/control > "$stage/DEBIAN/control"
          
          install -D -m 0644 packaging/LICENSE "$stage/usr/share/doc/$PKG/copyright"
          
          dpkg-deb --build --root-owner-group "$stage" "$WORK/${PKG}_${VERSION}_${DEB_ARCH}.deb"
          rm -rf "$stage"
      
      - name: Show DEB packages
        run: ls -lh packaging/deb/build/*.deb
      
      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: genectl-deb
          path: packaging/deb/build/*.deb
          retention-days: 14

  publish-packages:
    name: Publish to Release
    needs: [build-rpm, build-deb]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: List artifacts
        run: |
          echo "=== RPM packages ==="
          find ./artifacts/genectl-rpm -name "*.rpm" | xargs ls -lh
          echo "=== DEB packages ==="
          find ./artifacts/genectl-deb -name "*.deb" | xargs ls -lh
      
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./artifacts/genectl-rpm/**/*.rpm
            ./artifacts/genectl-deb/*.deb
          fail_on_unmatched_files: false
